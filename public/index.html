<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Processed attendance</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">⏱️ Processed attendance</div>
    <div class="nav-links">
      <a href="/" class="active">Home</a>
      <a href="/records.html">My Records</a>
      <a href="/admin.html">Admin</a>
      <button id="themeToggle" title="Toggle dark mode">🌙</button>
    </div>
  </nav>

  <main class="container">
    <div class="clock-card">
      <div class="live-clock" id="liveClock">--:--:--</div>
      <div class="live-date" id="liveDate">Loading...</div>
    </div>

    <div class="card">
      <h2>Employee Check-In</h2>
      <div class="form-group">
        <label for="employeeId">Employee ID</label>
        <input type="text" id="employeeId" placeholder="e.g. EMP001" />
      </div>
      <div class="form-group">
        <label for="employeeName">Full Name</label>
        <input type="text" id="employeeName" placeholder="e.g. Juan Dela Cruz" />
      </div>

      <div class="button-row">
        <button id="timeInBtn" class="btn btn-in">🟢 TIME IN</button>
        <button id="timeOutBtn" class="btn btn-out">🔴 TIME OUT</button>
      </div>

      <p class="hint">Tip: First time? Just enter your ID and name. Returning? Only ID is needed.</p>
    </div>

    <div class="card stats-card">
      <h2>Today's Summary</h2>
      <div class="stats-grid">
        <div class="stat">
          <div class="stat-value" id="statEmployees">-</div>
          <div class="stat-label">Total Employees</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statRecords">-</div>
          <div class="stat-label">Today's Records</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statIn">-</div>
          <div class="stat-label">Currently In</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statHours">-</div>
          <div class="stat-label">Hours Today</div>
        </div>
        <div class="stat">
        <div class="stat-value" id="statLate">-</div>
          <div class="stat-label">Late Today</div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="/js/app.js"></script>
</body>
</html>
